{% extends "base.html" %}

{% block content %}

<h1>Motion Capture</h1>

<div class="webcam-container">
    <video id="webcam" autoplay playsinline muted width="640"></video>
    <canvas id="poseCanvas" width="640" height="480"></canvas>
    <canvas id="processingCanvas" width="640" height="480" style="display: none;"></canvas>
</div>

<button id="startButton">
    Start Camera
</button>

<button id="recordButton" disabled>
    Start Recording
</button>

<button id="stopButton" disabled>
    Stop Recording
</button>

<p id="status"></p>

<script src="{{ url_for('static', filename='js/webcam.js') }}"></script>

{% endblock %}
